# Cloudflare Tunnel — expõe o servidor PDV com HTTPS sem abrir portas.
# Renomeie para config.yml e rode: cloudflared tunnel run pdv
#
# O Token (eyJh...) é criado no dashboard da Cloudflare; o túnel termina
# o TLS e encaminha para o Nginx local em HTTP na porta 80.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: pdv.sua-loja.com
    service: http://127.0.0.1:80
  - service: http_status:404
