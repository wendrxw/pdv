<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem conexão — PDV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f2342;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(15, 35, 66, 0.08);
        }
        .icone {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0878f9;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { color: #718096; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #0878f9;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0665d4; }
        .rodape { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Sem conexão com o servidor</h1>
        <p>
            Não foi possível acessar o sistema. Verifique sua conexão com a
            internet e tente novamente.
        </p>
        <button onclick="window.location.reload()">Tentar novamente</button>
        <div class="rodape">PDV — shell desktop</div>
    </div>
</body>
</html>
