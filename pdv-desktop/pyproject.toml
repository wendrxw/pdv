[project]
name = "pdv-desktop"
version = "0.1.0"
description = "Shell desktop do PDV — cliente rico em PyWebview (Linux/Windows)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pywebview>=5,<6",
    # Impressão no Windows via spooler (RAW). Instalado apenas no Windows.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
pdv-desktop = "pdv_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdv_desktop"]
