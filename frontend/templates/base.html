{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDV — Gestão simples para o seu negócio{% endblock %}</title>
    <meta name="description" content="{% block description %}Sistema completo para gestão de produtos, estoque, vendas e financeiro do seu negócio, em um único lugar.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ request.get_host }} — Gestão simples para o seu negócio{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Controle produtos, estoque, vendas e financeiro em um único lugar.{% endblock %}">
    <meta property="og:type" content="website">
    {% block extra_head %}{% endblock %}
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
                    },
                    colors: {
                        navy: {
                            50: "#f0f4fa",
                            100: "#dce5f2",
                            500: "#2d4a86",
                            600: "#22396b",
                            700: "#1b2f5c",
                            800: "#15264d",
                            900: "#0f1d3d",
                            950: "#0a1530",
                        },
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    {% block content %}{% endblock %}
</body>
</html>
