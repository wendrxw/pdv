[project]
name = "print-agent"
version = "0.1.0"
description = "Local Print Agent do PDV — imprime comprovantes e etiquetas na loja (Linux/Windows)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Impressão no Windows via spooler (RAW). Instalado apenas no Windows.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
print-agent = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
