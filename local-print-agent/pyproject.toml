[project]
name = "print-agent"
version = "0.1.0"
description = "Local Print Agent do PDV — imprime comprovantes em impressora térmica USB (usblp)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
print-agent = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
