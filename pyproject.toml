[project]
name = "pdv"
version = "0.1.0"
description = "Sistema SaaS multi-tenant para gestão de PDV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
    "psycopg2-binary>=2.9.12",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]
# RUF012 não se aplica a models/forms do Django (class attrs mutáveis são padrão)
ignore = ["RUF012"]

